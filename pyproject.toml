[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcldl"
version = "1.0.0"
description = "PCL2 下载引擎（ModNet）的 Python 复刻：动态分片 / 多源容错 / 断点续传"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "qaz1872" }]
keywords = ["download", "multithread", "range", "resume", "pcl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]

[project.scripts]
pcldl = "pcldl:main"

[project.urls]
Homepage = "https://github.com/qaz1872/pcldl"

[tool.setuptools]
py-modules = ["pcldl"]
